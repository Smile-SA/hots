---
variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: ignore
  # The runner only reaches a few hosts (astral.sh does not resolve), so get
  # tooling from PyPI and use the image's Python instead of letting uv
  # download interpreters from GitHub.
  UV_PYTHON_DOWNLOADS: never

cache:
  key: "uv-$CI_COMMIT_REF_SLUG"
  paths:
    - .uv-cache/
    - .tox/

.docker_login: &docker_login |
  echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

# Only the image builds need a Docker daemon.
.docker:
  image: docker:29
  services:
    - docker:29-dind

stages:
  - test
  - build

tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim-bookworm
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  script:
    - apt-get update
    - apt-get install -y build-essential libopenblas-dev gfortran libboost-thread-dev glpk-utils
    - python -m pip install tox tox-uv
    - tox -e "py$(echo "$PYTHON_VERSION" | tr -d .)"

lint:
  stage: test
  image: python:3.12-slim-bookworm
  script:
    - python -m pip install tox tox-uv
    - tox -e ruff,audit

# Build the sdist and wheel, then install the wheel in a clean venv (outside
# the checkout) and run the packaged sample config from the repo root, where
# its ./tests/data dataset resolves.
package:
  stage: build
  image: python:3.12-slim-bookworm
  variables:
    MPLBACKEND: Agg
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends glpk-utils
    - python -m pip install build twine
    - python -m build
    - python -m twine check --strict dist/*
    - python -m venv /tmp/wheel-venv
    - /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)"
    - /tmp/wheel-venv/bin/pip check
    - test "$(/tmp/wheel-venv/bin/hots --version)" = "hots, version $(cat VERSION.txt)"
    - test ! -e /tmp/wheel-venv/VERSION.txt
    - |
      SAMPLE="$(/tmp/wheel-venv/bin/python -c 'from importlib.resources import files; print(files("hots.config") / "sample_config_file.json")')"
      /tmp/wheel-venv/bin/hots --config "$SAMPLE"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build-master:
  extends: .docker
  stage: build
  script:
    - *docker_login
    - docker build --pull -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE"
  only:
    refs:
      - main

build:
  extends: .docker
  stage: build
  script:
    - *docker_login
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME"
  except:
    refs:
      - main

# Releases are published to PyPI from GitHub, by .github/workflows/release.yml
# when a v* tag reaches the GitHub mirror.
