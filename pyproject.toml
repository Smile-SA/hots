[build-system]
requires = [
    "setuptools>=61.2",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "hots"
description = "HOTS: dynamic microservice placement via clustering + optimization"
keywords = [
    "Resource",
    "Optimisation",
    "Clustering",
    "Planning",
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
authors = [
    { name = "Smile R&D team", email = "rnd@smile.fr" },
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
    "click>=8.0",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "psutil",
    "pyomo",
    "pydantic>=2.6",
    "scikit-learn",
    "scipy",
]
dynamic = [
    "version",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/Smile-SA/hots"
Documentation = "https://hots.readthedocs.io/en/latest/"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
doc = [
  "sphinx>=8",
  "sphinx-rtd-theme>=2",
]
kafka = [
    "confluent-kafka",
    "fastavro",
    "requests",
]
testing = [
    "pytest",
]
parquet = [
    "pyarrow>=14"
]

[project.scripts]
hots = "hots.cli:main"

[tool.setuptools]
zip-safe = false
include-package-data = true
platforms = [
    "any"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hots*"]

[tool.setuptools.data-files]
"." = [
    "VERSION.txt",
]

[tool.setuptools.dynamic.version]
file = [
    "VERSION.txt",
]

[tool.distutils.bdist_wheel]
universal = true

[tool.ruff]
line-length = 100
extend-exclude = [
    ".git",
    ".tox",
    "venv",
    "build",
    ".eggs",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (undefined names, unused imports, etc.)
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "I",    # isort (imports)
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "Q",    # flake8-quotes
    "C90",  # mccabe complexity
    "UP",   # pyupgrade (modern Python)
    "B",    # flake8-bugbear (common bugs)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["hots"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--verbosity=2"
markers = [
    "e2e: end-to-end tests",
]
