[tox]
envlist = py310,py311,py312,py313,ruff,audit
isolated_build = true

[testenv]
deps =
    .[dev,kafka]
commands =
    pytest

[testenv:ruff]
commands =
    ruff format --check .
    ruff check hots tests

# Audit the versions pinned in uv.lock (runtime + kafka extra), which is what the Docker image
# installs. pip-audit evaluates the lock's markers for its own interpreter, so keep base_python in
# line with the Dockerfile. Advisories come from PyPI, so no other host is needed.
[testenv:audit]
skip_install = true
base_python = python3.12
deps =
    pip-audit
    uv
commands =
    uv export --quiet --frozen --no-emit-project --extra kafka --output-file {env_tmp_dir}/requirements.txt
    pip-audit --strict --disable-pip --requirement {env_tmp_dir}/requirements.txt
